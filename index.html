<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>랜덤 선수 뽑기 (일자 배치·겹침 제어·Sheen 클립)</title>
  <style>
    :root{
      --bg1:#0f172a; --bg2:#060a14; --text:#e5e7eb; --muted:#9ca3af;
      --card:#0b1329; --card-2:#0c1534; --border:rgba(255,255,255,.16);
      --glow:0 18px 60px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans", Arial;
      color:var(--text);
      background: radial-gradient(1200px 600px at 20% -10%, #16213c, transparent), radial-gradient(circle at center, var(--bg1), var(--bg2));
    }

    /* ===== 상단 입력 패널 ===== */
    header{ padding:24px clamp(16px,3vw,36px) 8px; border-bottom:1px solid rgba(255,255,255,.06) }
    .panel{ width:min(900px, 96vw); margin:0 auto; background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
            border:1px solid var(--border); border-radius:18px; padding:18px; box-shadow: var(--glow) }
    h1{ margin:0 0 8px; font-size:clamp(20px, 3.6vw, 28px) }
    .subtitle{ color:var(--muted); font-size:13px; margin-bottom:12px }
    textarea{ width:100%; min-height:150px; border-radius:12px; padding:12px; background:#0a1022; color:var(--text);
              border:1px solid rgba(255,255,255,.14); resize:vertical; font-size:14px; line-height:1.5 }
    textarea:focus{ outline:none; border-color:rgba(125,211,252,.7); box-shadow:0 0 0 4px rgba(125,211,252,.15) }
    .row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:10px }
    .radio{ display:flex; gap:10px; align-items:center; padding:8px 10px; border:1px dashed rgba(255,255,255,.16); border-radius:12px }
    input[type=radio]{ accent-color:#60a5fa }
    .primary{ background: linear-gradient(135deg, rgba(125,211,252,.25), rgba(167,139,250,.25)); border:1px solid var(--border); border-radius:999px; padding:10px 16px; color:#fff; font-weight:800; cursor:pointer }
    .secondary{ background:#0c1631; border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:10px 16px; color:#fff; font-weight:800; cursor:pointer }

    /* ===== 아래 스테이지(팩 공간) ===== */
    .stage-wrap{ width:min(1200px, 96vw); margin:18px auto 24px; }
    .stage{ position:relative; height:min(70vh, 72dvh); border-radius:22px; overflow:hidden;
            border:1px solid rgba(255,255,255,.08); box-shadow: var(--glow);
            background: radial-gradient(900px 360px at 50% 130%, rgba(125,211,252,.08), rgba(34,211,238,.08), rgba(167,139,250,.09) 70%, transparent 75%),
                        radial-gradient(600px 250px at 50% -20%, rgba(125, 211, 252, .08), transparent 70%),
                        linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.02));
    }
    .stage-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:8px }

    .packs{ position:absolute; inset:0; perspective:1200px }
    .pack{
      position:absolute; left:50%; bottom:12%;
      width:120px; height:170px; border-radius:12px; cursor:pointer; transform-origin:50% 90%;
      background: linear-gradient(160deg, var(--card) 0%, var(--card-2) 70%), linear-gradient(120deg, rgba(125,211,252,.30), rgba(167,139,250,.25));
      border:1px solid var(--border); box-shadow: 0 10px 35px rgba(0,0,0,.45), inset 0 -20px 30px rgba(255,255,255,.05);
      transition: transform .7s cubic-bezier(.2,.8,.2,1), left .7s cubic-bezier(.2,.8,.2,1), bottom .7s cubic-bezier(.2,.8,.2,1), filter .3s, opacity .35s;
      /* (2) 반짝이 효과가 카드 밖으로 나가지 않도록 클립 */
      overflow:hidden;
    }
    .pack .label{ position:absolute; left:50%; top:8px; transform:translateX(-50%); font-size:11px; font-weight:800; letter-spacing:.8px; color:#c7d2fe;
                  background: linear-gradient(90deg, rgba(125,211,252,.15), rgba(167,139,250,.15)); padding:4px 8px; border-radius:999px; border:1px solid rgba(255,255,255,.14) }
    .pack .sheen{
      position:absolute; inset:0; border-radius:inherit;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.25) 50%, transparent 60%);
      transform: translateX(-120%);
      animation: sheen 3.5s linear infinite;
      mix-blend-mode: screen; opacity:.6;
      pointer-events:none;
    }
    @keyframes sheen{ to{ transform: translateX(120%) } }

    .pack.to-center{ left:50% !important; bottom:50% !important; transform: translate(-50%, 50%) rotate(0deg) scale(1.28) !important }
    .pack.fade-out{ opacity:0; transform: scale(.86) translateY(-20px) }

    /* 팩 뜯기 효과 */
    .pack.opening{ pointer-events:none }
    .pack-split{ position:absolute; inset:0; border-radius:inherit; overflow:hidden }
    .pack-split .half{ position:absolute; width:100%; height:50%; left:0; background: inherit; border:inherit }
    .pack-split .top{ top:0; border-bottom:1px solid rgba(255,255,255,.2) }
    .pack-split .bottom{ bottom:0; border-top:1px solid rgba(255,255,255,.2) }
    @keyframes tearTop{ to{ transform: translateY(-110%) rotate(-2deg); opacity:.85 } }
    @keyframes tearBottom{ to{ transform: translateY(110%) rotate(2deg); opacity:.85 } }

    /* 결과 오버레이 */
    .overlay{ position: fixed; inset: 0; display:none; place-items:center; background: rgba(3,7,18,.78); backdrop-filter: blur(4px); z-index: 1000 }
    .overlay.show{ display:grid }
    .popup{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; justify-content:center; transform: translateY(15px); opacity:0; animation: rise .4s ease forwards }
    @keyframes rise{ to{ transform: translateY(0); opacity:1 } }
    .result-card{ width:240px; height:340px; background: linear-gradient(180deg, #0d162f, #0a1022 55%), conic-gradient(from 0deg, rgba(125,211,252,.18), rgba(167,139,250,.18), rgba(34,211,238,.18), rgba(245,158,11,.16), rgba(125,211,252,.18));
                  border:1px solid rgba(255,255,255,.20); border-radius:18px; box-shadow: 0 25px 70px rgba(0,0,0,.5), inset 0 -20px 40px rgba(255,255,255,.05);
                  position:relative; overflow:hidden; backface-visibility:hidden; transform: rotateY(90deg) scale(.96); opacity:0 }
    .result-card .rim{ position:absolute; inset:10px; border-radius:14px; border:1px dashed rgba(255,255,255,.18) }
    .name{ position:absolute; inset: 18px 14px; display:grid; place-items:center; text-align:center; font-size: clamp(18px, 2.4vw, 22px); font-weight:800; line-height:1.25 }
    .result-card.show{ animation: flipIn .55s .35s cubic-bezier(.2,.8,.2,1) forwards }
    @keyframes flipIn{ from{ transform: rotateY(90deg) scale(.96); opacity:0 } to{ transform: rotateY(0); opacity:1 } }

    /* 토스트(경고) */
    .toast{ position: fixed; left:50%; bottom:22px; transform: translateX(-50%); background:#0a1022; border:1px solid rgba(255,255,255,.14); color:#e5e7eb; padding:10px 14px; border-radius: 999px; box-shadow: var(--glow); font-size:13px; display:none; z-index: 1200 }
    .toast.show{ display:block }
  </style>
</head>
<body>
  <header>
    <div class="panel">
      <h1>랜덤 선수 뽑기</h1>
      <div class="subtitle">명단 입력 → <b>팩 펼치기</b> → 팩 선택 → 다시 클릭해 카드 공개 → 리셋</div>
      <label for="names" class="subtitle" style="display:block">선수 이름을 <b>줄바꿈</b> 또는 <b>쉼표/세미콜론</b>으로 구분해 입력하세요.</label>
      <textarea id="names" placeholder="예) 손흥민\n김민재\n이강인\n..."></textarea>
      <div class="row">
        <div class="radio" role="radiogroup" aria-label="뽑기 수">
          <label><input type="radio" name="pick" value="1" checked> 1명</label>
          <label><input type="radio" name="pick" value="2"> 2명</label>
          <label><input type="radio" name="pick" value="2"> 5명</label>
        </div>
        <button id="dealBtn" class="primary" aria-label="팩 펼치기">팩 펼치기</button>
        <button id="resetBtn" class="secondary" aria-label="리셋">리셋</button>
      </div>
    </div>
  </header>

  <section class="stage-wrap">
    <div class="stage">
      <div id="packs" class="packs" aria-live="polite" aria-label="카드 팩 영역"></div>
    </div>
    <div class="stage-actions">
      <small class="subtitle">※ 팩을 한 번 클릭하면 중앙 확대, 다시 클릭하면 개봉합니다.</small>
    </div>
  </section>

  <!-- 결과 오버레이 -->
  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-label="뽑기 결과">
    <div>
      <div id="popup" class="popup"></div>
      <div style="display:flex; justify-content:center; gap:10px; margin-top:14px;">
        <button id="closeBtn" class="secondary" aria-label="닫기">닫기</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // ---- 유틸 ----
    const $ = (sel, el=document) => el.querySelector(sel);
    const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
    function showToast(msg){ const n = $('#toast'); n.textContent = msg; n.classList.add('show'); clearTimeout(showToast._t); showToast._t = setTimeout(()=> n.classList.remove('show'), 1800); }

    // 구분자 보강: 줄바꿈, 콤마(영/전각), 세미콜론(영/전각), 일본어 쉼표, 가운뎃점(·/ㆍ), 탭/파이프
    function parseNames(raw){
      if(!raw) return [];
      const SEP = /[\r\n,，;；、·ㆍ\|\t]+/g;
      return raw
        .split(SEP)
        .map(s => s.replace(/\s+/g, ' ').trim())
        .filter(Boolean);
    }

    const unique = arr => Array.from(new Set(arr));
    function randInt(max){ if(window.crypto && crypto.getRandomValues){ const b=new Uint32Array(1); crypto.getRandomValues(b); return b[0]%max; } return Math.floor(Math.random()*max); }
    function sampleWithoutReplacement(arr,k){ const n=arr.length; if(k>n) k=n; const idx=new Set(); while(idx.size<k){ idx.add(randInt(n)); } return Array.from(idx).map(i=>arr[i]); }

    // ---- 상태 ----
    let state = { names: [], pickedCount: 1, selectedPack: null, revealed:false };

    // ---- DOM ----
    const packsEl = $('#packs');
    const overlay = $('#overlay');
    const popup = $('#popup');
    const closeBtn = $('#closeBtn');
    const namesInput = $('#names');
    const dealBtn = $('#dealBtn');
    const resetBtn = $('#resetBtn');

    // ---- 옵션 ----
    $$('input[name="pick"]').forEach(r=> r.addEventListener('change', e=> state.pickedCount = parseInt(e.target.value,10)||1));

    // ---- 버튼 이벤트 ----
    dealBtn.addEventListener('click', ()=>{
      const names = unique(parseNames(namesInput.value));
      if(names.length===0){ showToast('선수 명단을 입력하세요.'); return; }
      if(state.pickedCount>names.length){ showToast('뽑기 수가 이름 수보다 많습니다.'); return; }
      state.names = names; state.selectedPack=null; state.revealed=false;
      renderPacks(names.length);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    });

    resetBtn.addEventListener('click', ()=>{ resetAll(); });
    closeBtn.addEventListener('click', ()=> overlay.classList.remove('show'));

    function resetAll(){ packsEl.innerHTML=''; state.selectedPack=null; state.revealed=false; namesInput.focus(); showToast('초기화되었습니다.'); }

    // ---- 팩 렌더링 ----
    function renderPacks(n){
      packsEl.innerHTML='';
      for(let i=0;i<n;i++){
        const pack = document.createElement('div');
        pack.className='pack';
        pack.setAttribute('role','button');
        pack.setAttribute('tabindex','0');
        pack.setAttribute('aria-label',`카드 팩 ${i+1}`);
        const label = document.createElement('div'); label.className='label'; label.textContent = 'PACK';
        const sheen = document.createElement('div'); sheen.className='sheen';
        pack.append(label, sheen);
        packsEl.appendChild(pack);
      }
      const packs = $$('.pack', packsEl);

      // 일자(직선) 레이아웃
      linearLayout(packs);

      packs.forEach(p=>{
        const onSelect=()=>handleSelect(p);
        p.addEventListener('click', onSelect);
        p.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onSelect(); } });
      });

      window.onresize = ()=> linearLayout($$('.pack', packsEl));
    }

    // ---- 일자 레이아웃 (5% 확대, 고정 여백, 카드 많아질수록 겹침 증가, 그룹 중앙 정렬) ----
    function linearLayout(packs){
      const n = packs.length; if(n===0) return;
      const stageEl = document.querySelector('.stage');
      const stageW = stageEl.clientWidth || 800;
      const stageH = stageEl.clientHeight || 500;

      const cardW = 120;
      const scaleBase = 1.05;                 // (1) 카드 5% 확대
      const cardWScaled = cardW * scaleBase;

      // 좌우 여백 "고정": 모바일 24px, 그 외 48px
      const sideMargin = stageW < 640 ? 24 : 48;

      // 가용 폭
      const available = stageW - sideMargin * 2;

      // gap을 available에 정확히 맞추는 값으로 계산 (음수 가능 = 겹침)
      // → 카드 수가 많아질수록 자동으로 겹침량이 커지며, 좌우 여백은 항상 고정 유지
      let gap = n > 1 ? (available - n * cardWScaled) / (n - 1) : 0;

      // 보기 좋은 상한만 둠(양수일 때 너무 벌어지지 않도록). 음수는 제한하지 않음.
      const maxGap = 44;
      if (gap > maxGap) gap = maxGap;

      // 그룹 중앙 정렬: 고정 여백 영역 내부에서 중앙 배치
      const totalWidth = n * cardWScaled + (n - 1) * gap;
      const startX = sideMargin + (available - totalWidth) / 2;

      // 수직 위치 (무대에서 살짝 위)
      const bottomPct = Math.max(10, Math.min(20, Math.round(stageH / 9)));

      for (let i = 0; i < n; i++) {
        const el = packs[i];
        const x = Math.round(startX + i * (cardWScaled + gap));
        el.style.left = '0px';
        el.style.bottom = `${bottomPct}%`;
        el.style.transform = `translateX(${x}px) translateZ(0) scale(${scaleBase})`;
        el.style.zIndex = '100';
      }
    }

    // ---- 선택 & 공개 ----
    function handleSelect(pack){
      if(state.selectedPack && pack!==state.selectedPack) return;
      if(!state.selectedPack){
        state.selectedPack = pack;
        // 다른 팩 제거
        $$('.pack', packsEl).forEach(p=>{ if(p!==pack){ p.classList.add('fade-out'); setTimeout(()=>p.remove(), 380);} });
        // 중앙 이동
        requestAnimationFrame(()=> pack.classList.add('to-center'));
        // 두 번째 클릭에서 개봉
        return;
      }
      if(!state.revealed){ openPack(pack); state.revealed=true; }
    }

    function openPack(pack){
      pack.classList.add('opening');
      const split=document.createElement('div');
      split.className='pack-split';
      split.innerHTML='<div class="half top"></div><div class="half bottom"></div>';
      pack.appendChild(split);
      split.querySelector('.top').style.animation='tearTop .45s ease forwards';
      split.querySelector('.bottom').style.animation='tearBottom .45s ease forwards';

      // 결과 카드 준비
      const k=state.pickedCount;
      const picks = sampleWithoutReplacement(state.names, k);
      popup.innerHTML='';
      picks.forEach(name=>{
        const card=document.createElement('div');
        card.className='result-card';
        card.innerHTML = '<div class="rim"></div><div class="name">'+escapeHtml(name)+'</div>';
        popup.appendChild(card);
      });

      setTimeout(()=>{
        overlay.classList.add('show');
        $$('.result-card', popup).forEach((c,i)=> setTimeout(()=> c.classList.add('show'), i*90));
      }, 420);
    }

    function escapeHtml(str){
      return str.replace(/[&<>"']/g, m => (
        {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
      ));
    }
  </script>
</body>
</html>
